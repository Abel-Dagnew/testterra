steps:
# Step 1: Install Terraform
- task: Bash@3
  displayName: 'Install Terraform'
  inputs:
    targetType: 'inline'
    script: |
      echo "Downloading Terraform..."
      curl -o terraform.zip https://releases.hashicorp.com/terraform/1.0.11/terraform_1.0.11_linux_amd64.zip
      echo "Unzipping Terraform..."
      unzip terraform.zip
      sudo mv terraform /usr/local/bin/
      echo "Verifying Terraform Installation..."
      terraform -version

# Step 2: Set Environment Variables for Terraform
- task: AzureCLI@2
  displayName: 'Set Environment Variables for Terraform'
  inputs:
    azureSubscription: 'Abel-serviceP-conn'  # Optional for Azure CLI login; if using Service Principal, this can be left blank
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Setting environment variables for Terraform authentication..."
      export TF_LOG=DEBUG
      export TF_LOG_PATH="terraform_debug.log"
      export TF_VAR_client_id=$(ARM_CLIENT_ID)
      export TF_VAR_client_secret=$(ARM_CLIENT_SECRET)
      export TF_VAR_tenant_id=$(ARM_TENANT_ID)
      export TF_VAR_subscription_id=$(ARM_SUBSCRIPTION_ID)
      echo "Environment variables set."

# Step 3: Terraform Init using AzureCLI@2
- task: AzureCLI@2
  displayName: 'Terraform Init'
  inputs:
    azureSubscription: ''  # Leave blank to use the environment variables set in previous step
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Initializing Terraform..."
      terraform init \
        -backend-config="storage_account_name=terrastate345" \
        -backend-config="container_name=state-cont" \
        -backend-config="key=terraform.tfstate"

# Step 4: Terraform Apply using AzureCLI@2
- task: AzureCLI@2
  displayName: 'Terraform Apply'
  inputs:
    azureSubscription: ''  # Leave blank to use the environment variables set in previous step
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      echo "Applying Terraform configuration..."
      terraform apply -auto-approve

